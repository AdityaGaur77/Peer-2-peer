name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Type-check + production build
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # SSR-renders every route and asserts key content on each
      - name: Smoke
        run: npm run smoke
