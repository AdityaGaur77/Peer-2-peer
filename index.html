<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Peer 2 Peer is tutoring run by high school students. Live classes in math, English, Spanish, engineering, coding and more. Most classes are free."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peer 2 Peer — tutoring by students" />
    <meta
      property="og:description"
      content="Live classes taught by high school students. Most are free. Book a seat, or teach one yourself."
    />
    <meta name="theme-color" content="#f3f8fc" />
    <title>Peer 2 Peer — tutoring by students</title>
    <script>
      // set the theme before first paint — no flash
      (function () {
        try {
          var t = localStorage.getItem('relay.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
