    <meta name="theme-color" content="#f3f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071a33" media="(prefers-color-scheme: dark)" />
    <title>Peer 2 Peer — tutoring by students</title>
    <script>
      // set the theme before first paint — no flash
      (function () {
        try {
          var t = localStorage.getItem('relay.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
